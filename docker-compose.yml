version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: laptop_store_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-laptop_store}
      MYSQL_USER: ${DB_USER:-laptopuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laptoppassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./laptop_store_database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - laptop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laptop_store_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-laptopuser}
      DB_PASSWORD: ${DB_PASSWORD:-laptoppassword}
      DB_NAME: ${DB_NAME:-laptop_store}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - laptop-network
    command: npm run start:dev

networks:
  laptop-network:
    driver: bridge

volumes:
  mysql-data:
